<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>compras</title>
    <link
      rel="stylesheet"
      href="./css/global.css"
    />
    <link
      rel="stylesheet"
      href="./css/carrinho.css"
    />
  </head>
  <body>
    <header class="cab">
      <!--MENU PRINCIPAL-->
      <a href="./index.html"><h2>habbi's</h2></a>
      <article>
        <div class="navegacao">
          <input
            type="search"
            name="search"
            id="search"
          />
          <label for="search"
            ><img
              class="lup"
              src="./img/icons/lupa.png"
              alt="lupa_pesquisa"
            />
          </label>
        </div>
        <div>
          <a href="./account.html"
            ><img
              class="user"
              src="./img/icons/user.png"
              alt=""
          /></a>
        </div>
        <div>
          <a href="#"
            ><img
              class="buys"
              src="./img/icons/compra.png"
              alt=""
          /></a>
        </div>
      </article>
    </header>
    <main>
      <section class="carrinho">
        <div class="text-carrinho">
          <h2>Confira seu pedido</h2>
        </div>
        <article class="pedido">
          <div class="item">
            <h2>Carrinho vazio</h2>
          </div>
        </article>
      </section>
    </main>

    <footer class="rodape">
      <article class="rodape-camp">
        <div class="camp-text">
          <h2>Alô!</h2>
        </div>
        <div class="camp-num">
          <h2>(47) 9999 9999</h2>
        </div>
      </article>

      <p></p>

      <article class="rodape-camp">
        <div class="camp-text">
          <h2>Quer pedir por telefone?</h2>
        </div>
        <div class="camp-num">
          <h2>9746 811 888</h2>
        </div>
      </article>
    </footer>
  </body>
</html>
